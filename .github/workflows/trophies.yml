name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Trophies SVG
        run: |
          mkdir -p dist
          # curl দিয়ে বিকল্প মিরর থেকে ডেটা সংগ্রহ
          curl -L -s --compressed "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=onedark&no-frame=false&no-bg=false&margin-w=4" -o dist/trophies.svg
          
          # যদি ফাইলটি খালি থাকে বা ভুল আসে তাহলে ব্যাকআপ তৈরি
          if [ ! -s dist/trophies.svg ]; then
            echo "Failed to fetch from primary, trying fallback..."
            curl -L -s --compressed "https://profile-trophies.deno.dev/api?username=${{ github.repository_owner }}&theme=onedark" -o dist/trophies.svg
          fi

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          destination_dir: trophies
