name: Generate Snake Animation (Professional Ocean Theme)

on:
  schedule:
    # প্রতিদিন রাত ১২টায় স্বয়ংক্রিয়ভাবে চলবে
    - cron: "0 0 * * *"
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন
  push:
    branches:
      - main # main branch-এ push হলে চলবে

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # আপনার কন্ট্রিবিউশন গ্রিড থেকে প্রফেশনাল সাপ তৈরি করবে
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # default output (ডার্ক মোডেও কাজ করবে কিন্তু কাস্টম কালার নয়)
            dist/github-contribution-grid-snake.svg
            
            # প্রফেশনাল কাস্টম ওশান থিম (Light Mode-এর জন্য)
            dist/ocean.svg?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
            
            # প্রফেশনাল কাস্টম ডার্ক ওশান থিম (Dark Mode-এর জন্য)
            dist/ocean-dark.svg?palette=github-dark&color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
            
      # তৈরি হওয়া SVG ফাইলগুলো output ব্রাঞ্চে পুশ করবে
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
